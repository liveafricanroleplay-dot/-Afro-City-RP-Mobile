name: Build AFRO CITY RP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Afro-City-RP-Mobile-Discord-Updated.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Extract Android project
        run: |
          unzip -q Afro-City-RP-Mobile-Discord-Updated.zip
          test -f Afro-City-RP-Mobile/gradlew
          test -f Afro-City-RP-Mobile/app/build.gradle

      - name: Build debug APK
        working-directory: Afro-City-RP-Mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: afro-city-rp-test-apk
          path: Afro-City-RP-Mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
