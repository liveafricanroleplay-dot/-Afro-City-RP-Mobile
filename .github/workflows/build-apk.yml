name: Build AFRO CITY RP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Afro-City-RP-Mobile-Discord-Updated.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Extract Android project
        run: |
          unzip -q Afro-City-RP-Mobile-Discord-Updated.zip
          test -f Afro-City-RP-Mobile/gradlew
          test -f Afro-City-RP-Mobile/app/build.gradle

      - name: Fix duplicate case-sensitive C++ headers
        working-directory: Afro-City-RP-Mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/cpp/AfroCityRP")
          upper = root / "Game"
          lower = root / "game"

          if not upper.is_dir() or not lower.is_dir():
              raise SystemExit("Expected both Game and game source folders")

          upper_headers = {p.name: p for p in upper.glob("*.h")}
          lower_headers = {p.name: p for p in lower.glob("*.h")}
          duplicates = sorted(set(upper_headers) & set(lower_headers))

          for name in duplicates:
              guard = "AFRO_CITYRP_SHARED_" + re.sub(r"[^A-Za-z0-9]", "_", name).upper()
              for path in (upper_headers[name], lower_headers[name]):
                  data = path.read_text(encoding="utf-8-sig")
                  if f"#ifndef {guard}" in data:
                      continue
                  path.write_text(
                      f"#ifndef {guard}\n#define {guard}\n" + data.rstrip() +
                      f"\n#endif // {guard}\n",
                      encoding="utf-8"
                  )

          print(f"Added shared include guards to {len(duplicates)} duplicate header pairs")
          PY

      - name: Build debug APK
        working-directory: Afro-City-RP-Mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: afro-city-rp-test-apk
          path: Afro-City-RP-Mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
